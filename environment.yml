# Local conda environment for XRAP development.
#
#   conda env create -f environment.yml
#   conda activate xrap
#   pip install -e ".[dev]"
#
# Everything stays local to this env; nothing is installed system-wide.
name: xrap
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # --- scientific stack (conda-forge builds are faster / prebuilt) ---
  - numpy>=1.23
  - scipy>=1.10
  - pandas>=2.0
  - xarray>=2023.1
  - astropy>=5.3
  - sunpy>=5.0
  - requests>=2.28
  - python-dateutil>=2.8
  - netCDF4>=1.6
  - h5netcdf>=1.1
  - matplotlib>=3.7
  # --- tooling ---
  - pytest>=7.4
  - pytest-cov>=4.1
  - pytest-mock>=3.11
  - ruff>=0.4
  - python-build>=1.0        # conda-forge name for the PyPI 'build' package
  - pip:
      - responses>=0.23
      # Install XRAP itself in editable mode after the env is created:
      #   pip install -e ".[dev]"
